apiVersion: apps/v1
kind: Deployment
metadata:
  name: multicloud-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: multicloud-app
  template:
    metadata:
      labels:
        app: multicloud-app
    spec:
      containers:
      - name: multicloud-app
        image: josesamuel14/multicloud-app:016cfd34a8281a82ad63a2bc7ae3d49452275847
        ports:
        - containerPort: 5000
        env:
        - name: CLOUD_PROVIDER
          value: "local"
