apiVersion: apps/v1
kind: Deployment
metadata:
  name: multicloud-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: multicloud-app
  template:
    metadata:
      labels:
        app: multicloud-app
    spec:
      containers:
      - name: multicloud-app
        image: josesamuel14/multicloud-app:fa4a2bd840601860d54cf6866587974b2e381581
        ports:
        - containerPort: 5000
        env:
        - name: CLOUD_PROVIDER
          value: "local"
