name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - devops-v2
      - devops-v3
  repository_dispatch:
    types: [manual-deploy]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest tests/test_app.py

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          load: true
          tags: |
            josesamuel14/multicloud-app:latest
            josesamuel14/multicloud-app:${{ github.sha }}

      - name: Smoke test Docker image
        run: |
          docker run -d --name multicloud-app-smoke -p 5000:5000 josesamuel14/multicloud-app:${{ github.sha }}
          trap 'docker logs multicloud-app-smoke || true; docker rm -f multicloud-app-smoke || true' EXIT
          curl --fail --retry-all-errors --retry 10 --retry-delay 2 http://localhost:5000/health

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: josesamuel14/multicloud-app:${{ github.sha }}
          format: table
          scanners: vuln
          version: v0.74.0
          skip-files: /usr/local/lib/python3.11/site-packages/pip/_vendor/bom.cdx.json
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push josesamuel14/multicloud-app:latest
          docker push josesamuel14/multicloud-app:${{ github.sha }}
