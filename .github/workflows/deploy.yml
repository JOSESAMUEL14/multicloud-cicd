name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - devops-v2
      - devops-v3
      - v4-aws-ec2-deployment

  repository_dispatch:
    types: [manual-deploy]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest tests/test_app.py

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          load: true
          tags: |
            josesamuel14/multicloud-app:latest
            josesamuel14/multicloud-app:${{ github.sha }}

      - name: Smoke test Docker image
        run: |
          docker run -d \
            --name multicloud-app-smoke \
            -p 5000:5000 \
            josesamuel14/multicloud-app:${{ github.sha }}

          trap 'docker logs multicloud-app-smoke || true; docker rm -f multicloud-app-smoke || true' EXIT

          curl --fail \
            --retry-all-errors \
            --retry 10 \
            --retry-delay 2 \
            http://localhost:5000/health

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: josesamuel14/multicloud-app:${{ github.sha }}
          format: table
          scanners: vuln
          version: v0.74.0
          skip-files: /usr/local/lib/python3.11/site-packages/pip/_vendor/bom.cdx.json
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Set up Kubernetes
        uses: helm/kind-action@v1.14.0
        with:
          version: v0.31.0
          cluster_name: multicloud-ci
          wait: 60s

      - name: Verify Kubernetes cluster
        run: |
          kind get clusters
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Prepare Kubernetes image
        run: |
          docker tag \
            josesamuel14/multicloud-app:${{ github.sha }} \
            multicloud-app:nonroot

          kind load docker-image \
            multicloud-app:nonroot \
            --name multicloud-ci

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml

      - name: Wait for Kubernetes rollout
        run: |
          kubectl rollout status \
            deployment/multicloud-app \
            --timeout=120s

      - name: Verify Kubernetes deployment
        run: |
          kubectl get deployment multicloud-app
          kubectl get pods -l app=multicloud-app
          kubectl get service multicloud-app-service

          READY=$(kubectl get deployment multicloud-app \
            -o jsonpath='{.status.readyReplicas}')

          AVAILABLE=$(kubectl get deployment multicloud-app \
            -o jsonpath='{.status.availableReplicas}')

          test "$READY" = "2"
          test "$AVAILABLE" = "2"

      - name: Verify application health in Kubernetes
        run: |
          kubectl port-forward \
            service/multicloud-app-service \
            5000:5000 \
            > /tmp/port-forward.log 2>&1 &

          PORT_FORWARD_PID=$!

          trap 'kill $PORT_FORWARD_PID || true' EXIT

          sleep 5

          curl --fail \
            --retry-all-errors \
            --retry 10 \
            --retry-delay 2 \
            http://127.0.0.1:5000/health

      - name: Show Kubernetes diagnostics
        if: always()
        run: |
          kubectl get pods -o wide
          kubectl get deployment multicloud-app
          kubectl describe deployment multicloud-app
          kubectl describe pods -l app=multicloud-app

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push josesamuel14/multicloud-app:latest
          docker push josesamuel14/multicloud-app:${{ github.sha }}

  deploy-to-ec2:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy exact Git SHA to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            NEW_IMAGE="josesamuel14/multicloud-app:${{ github.sha }}"
            CONTAINER_NAME="multicloud-app"

            echo "=========================================="
            echo "AWS EC2 DEPLOYMENT"
            echo "=========================================="

            echo "New image:"
            echo "$NEW_IMAGE"

            echo "------------------------------------------"
            echo "Pulling new Docker image..."
            echo "------------------------------------------"

            docker pull "$NEW_IMAGE"

            echo "------------------------------------------"
            echo "Detecting currently deployed image..."
            echo "------------------------------------------"

            OLD_IMAGE=$(docker inspect \
              --format='{{.Config.Image}}' \
              "$CONTAINER_NAME" 2>/dev/null || true)

            echo "Previous image: ${OLD_IMAGE:-none}"

            echo "------------------------------------------"
            echo "Stopping existing container..."
            echo "------------------------------------------"

            docker stop "$CONTAINER_NAME" || true

            echo "------------------------------------------"
            echo "Removing existing container..."
            echo "------------------------------------------"

            docker rm "$CONTAINER_NAME" || true

            echo "------------------------------------------"
            echo "Starting new container..."
            echo "------------------------------------------"

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p 5000:5000 \
              -e CLOUD_PROVIDER=aws \
              -e CLOUD_REGION=ap-south-1 \
              "$NEW_IMAGE"

            echo "------------------------------------------"
            echo "Waiting for application..."
            echo "------------------------------------------"

            sleep 5

            echo "------------------------------------------"
            echo "Checking application health..."
            echo "------------------------------------------"

            if curl \
              --fail \
              --retry 10 \
              --retry-delay 3 \
              http://localhost:5000/health; then

              echo ""
              echo "=========================================="
              echo "EC2 DEPLOYMENT SUCCESSFUL"
              echo "=========================================="

            else

              echo ""
              echo "=========================================="
              echo "NEW DEPLOYMENT FAILED"
              echo "STARTING ROLLBACK"
              echo "=========================================="

              echo "------------------------------------------"
              echo "Removing failed container..."
              echo "------------------------------------------"

              docker rm -f "$CONTAINER_NAME" || true

              if [ -n "$OLD_IMAGE" ]; then

                echo "------------------------------------------"
                echo "Rolling back to previous image..."
                echo "------------------------------------------"

                docker run -d \
                  --name "$CONTAINER_NAME" \
                  --restart unless-stopped \
                  -p 5000:5000 \
                  -e CLOUD_PROVIDER=aws \
                  -e CLOUD_REGION=ap-south-1 \
                  "$OLD_IMAGE"

                echo "------------------------------------------"
                echo "Waiting for rollback..."
                echo "------------------------------------------"

                sleep 5

                echo "------------------------------------------"
                echo "Checking rollback health..."
                echo "------------------------------------------"

                curl \
                  --fail \
                  --retry 10 \
                  --retry-delay 3 \
                  http://localhost:5000/health

                echo ""
                echo "=========================================="
                echo "ROLLBACK SUCCESSFUL"
                echo "=========================================="

              else

                echo "No previous image available for rollback."

              fi

              exit 1

            fi