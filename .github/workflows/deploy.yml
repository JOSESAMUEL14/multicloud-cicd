
name: CI/CD Pipeline

o  push:
    branches: [ main ]

jobs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_TOKEN }}

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./app
        push: true
        tags: josesamuel14/multicloud-app:${{ github.sha }}

    - name: Update deployment image
      run: |
        sed -i 's|josesamuel14/multicloud-app:.*|josesamuel14/multicloud-app:${{ github.sha }}|' deployment.yaml
        git config user.name "JOSE SAMUEL"
        git config user.email "Josesamueld2005@gmail.com"
        git add deployment.yaml
        git commit -m "Update image to ${{ github.sha }}"
        git push
